<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${turbo.ref != null ? 'Edit Turbocharger' : 'New Turbocharger'} + ' - TurboMeta'">Turbo Form - TurboMeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --tm-dark: #1e1e1e;
            --tm-dark-gray: #2d2d2d;
            --tm-gray: #3e3e3e;
            --tm-orange: #e67e22;
            --tm-yellow: #f1c40f;
            --tm-red: #e74c3c;
            --tm-light: #ecf0f1;
        }
        .sidebar { min-height: 100vh; background-color: var(--tm-dark-gray); }
        .sidebar a { color: var(--tm-light); text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: var(--tm-gray); color: var(--tm-orange); }
        .sidebar .brand { padding: 20px; font-size: 1.25rem; font-weight: 700; color: var(--tm-orange); border-bottom: 1px solid var(--tm-gray); }
        body { background-color: var(--tm-dark); color: var(--tm-light); }
        .main-content { padding: 2rem; background-color: var(--tm-dark); }
        .btn-primary { background-color: var(--tm-orange); border-color: var(--tm-orange); }
        .btn-primary:hover { background-color: var(--tm-red); border-color: var(--tm-red); }
        .btn-outline-secondary { color: var(--tm-light); border-color: var(--tm-gray); }
        .btn-outline-secondary:hover { background-color: var(--tm-gray); border-color: var(--tm-gray); }
        .btn-outline-light { color: var(--tm-yellow) !important; border-color: var(--tm-yellow); }
        .btn-outline-light:hover { background-color: var(--tm-yellow); color: var(--tm-dark) !important; }
        .card { background-color: var(--tm-dark-gray); border-color: var(--tm-gray); }
        .card-body { color: var(--tm-light); }
        .form-label { color: var(--tm-light); }
        .form-control { background-color: var(--tm-gray); border-color: var(--tm-gray); color: var(--tm-light); }
        .form-control:focus { border-color: var(--tm-orange); box-shadow: 0 0 0 0.2rem rgba(230,126,34,0.25); }
        .text-muted { color: var(--tm-yellow) !important; }
        h2 { color: var(--tm-light); }
        .alert-danger { background-color: rgba(231,76,60,0.2); border-color: var(--tm-red); color: var(--tm-light); }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
            <div class="brand">⚙️ TurboMeta</div>
            <div class="nav flex-column">
                <a th:href="@{/backoffice/users}" class="nav-link">👥 Users</a>
                <a th:href="@{/backoffice/turbos}" class="nav-link active">⚙️ Turbochargers</a>
                <a th:href="@{/frontoffice/search}" class="nav-link">🔍 Search (Frontoffice)</a>
                <form th:action="@{/logout}" method="post" style="margin-top: 1rem;">
                    <button type="submit" class="btn btn-outline-light btn-sm w-100">🚪 Logout</button>
                </form>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 th:text="${turbo.ref != null ? '✏️ Edit Turbocharger' : '➕ New Turbocharger'}"></h2>
                <a href="/backoffice/turbos" class="btn btn-outline-secondary">← Back</a>
            </div>

            <div class="card" style="max-width: 600px;">
                <div class="card-body">
                    <form th:action="${turbo.ref != null ? '/backoffice/turbos/edit/' + turbo.ref : '/backoffice/turbos'}"
                          method="post">

                        <div class="mb-3">
                            <label for="ref" class="form-label">Reference</label>
                            <input type="text" class="form-control" id="ref" name="ref"
                                   th:value="${turbo.ref}"
                                   th:readonly="${turbo.ref != null}"
                                   required>
                            <small class="text-muted" th:if="${turbo.ref != null}">Reference cannot be changed after creation.</small>
                        </div>

                        <div class="mb-3">
                            <label for="brand" class="form-label">Brand</label>
                            <input type="text" class="form-control" id="brand" name="brand"
                                   th:value="${turbo.brand}" required>
                        </div>

                        <div class="mb-3">
                            <label for="model" class="form-label">Model</label>
                            <input type="text" class="form-control" id="model" name="model"
                                   th:value="${turbo.model}" required>
                        </div>

                        <div class="mb-3">
                            <label for="geo" class="form-label">Geometry (optional)</label>
                            <input type="text" class="form-control" id="geo" name="geo"
                                   th:value="${turbo.geo}">
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <span th:if="${turbo.ref != null}">Update</span>
                            <span th:unless="${turbo.ref != null}">Create</span>
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
