<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turbochargers - TurboMeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --tm-dark: #1e1e1e;
            --tm-dark-gray: #2d2d2d;
            --tm-gray: #3e3e3e;
            --tm-orange: #e67e22;
            --tm-yellow: #f1c40f;
            --tm-red: #e74c3c;
            --tm-light: #ecf0f1;
        }
        body { background-color: var(--tm-dark); color: var(--tm-light); }
        .sidebar { min-height: 100vh; background-color: var(--tm-dark-gray); }
        .sidebar a { color: var(--tm-light); text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: var(--tm-gray); color: var(--tm-orange); }
        .sidebar .brand { padding: 20px; font-size: 1.25rem; font-weight: 700; color: var(--tm-orange); border-bottom: 1px solid var(--tm-gray); }
        .main-content { padding: 2rem; background-color: var(--tm-dark); }
        .btn-primary { background-color: var(--tm-orange); border-color: var(--tm-orange); }
        .btn-primary:hover { background-color: var(--tm-red); border-color: var(--tm-red); }
        .btn-outline-primary { color: var(--tm-orange); border-color: var(--tm-orange); }
        .btn-outline-primary:hover { background-color: var(--tm-orange); border-color: var(--tm-orange); color: #fff; }
        .btn-outline-secondary { color: var(--tm-light); border-color: var(--tm-gray); }
        .btn-outline-secondary:hover { background-color: var(--tm-gray); border-color: var(--tm-gray); }
        .btn-outline-danger { color: var(--tm-red); border-color: var(--tm-red); }
        .btn-outline-danger:hover { background-color: var(--tm-red); color: #fff; }
        .btn-outline-light { color: var(--tm-yellow) !important; border-color: var(--tm-yellow); }
        .btn-outline-light:hover { background-color: var(--tm-yellow); color: var(--tm-dark) !important; }
        .form-control { background-color: var(--tm-gray); border-color: var(--tm-gray); color: var(--tm-light); }
        .form-control::placeholder { color: #888; }
        .form-control:focus { border-color: var(--tm-orange); box-shadow: 0 0 0 0.2rem rgba(230,126,34,0.25); }
        .table, .table *, .table thead, .table tbody, .table th, .table td { background-color: #f5f5f5 !important; }
        .table thead tr, .table thead tr th { background-color: #e0e0e0 !important; }
        .table-striped tbody tr:nth-of-type(odd), .table-striped tbody tr:nth-of-type(odd) td { background-color: #e8e8e8 !important; }
        .table-hover tbody tr:hover, .table-hover tbody tr:hover td { background-color: #d0d0d0 !important; color: var(--tm-dark) !important; }
        h2 { color: var(--tm-light); }
        .alert-success { background-color: rgba(230,126,34,0.2); border-color: var(--tm-orange); color: var(--tm-light); }
        .alert-danger { background-color: rgba(231,76,60,0.2); border-color: var(--tm-red); color: var(--tm-light); }

        /* Mobile sidebar styles */
        .sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100vh;
            z-index: 1050;
            transition: left 0.3s ease;
            overflow-y: auto;
        }
        .sidebar.show {
            left: 0;
        }
        .sidebar-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 1040;
            display: none;
        }
        .sidebar-backdrop.show {
            display: block;
        }
        .mobile-header {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            background-color: var(--tm-dark-gray);
            border-bottom: 1px solid var(--tm-gray);
        }
        .mobile-header .brand-text {
            margin-left: 15px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--tm-orange);
        }
        .btn-toggle-sidebar {
            background: none;
            border: none;
            color: var(--tm-light);
            font-size: 1.5rem;
            padding: 0;
            cursor: pointer;
        }
        @media (min-width: 768px) {
            .sidebar {
                position: relative;
                left: 0;
            }
            .sidebar-backdrop { display: none !important; }
            .mobile-header { display: none !important; }
        }
        @media (max-width: 767px) {
            .main-content { padding: 1rem !important; }
        }
    </style>
</head>
<body>
<div class="sidebar-backdrop" id="sidebarBackdrop"></div>
<div class="container-fluid">
    <div class="row">
        <!-- Mobile header with hamburger -->
        <div class="mobile-header">
            <button class="btn-toggle-sidebar" id="sidebarToggle">☰</button>
            <span class="brand-text">⚙️ TurboMeta</span>
        </div>
        <nav class="col-md-3 col-lg-2 d-md-block sidebar" id="sidebar">
            <div class="brand">⚙️ TurboMeta</div>
            <div class="nav flex-column">
                <a th:href="@{/backoffice/users}" class="nav-link">👥 Users</a>
                <a th:href="@{/backoffice/turbos}" class="nav-link active">⚙️ Turbochargers</a>
                <a th:href="@{/frontoffice/search}" class="nav-link">🔍 Search (Frontoffice)</a>
                <form th:action="@{/logout}" method="post" style="margin-top: 1rem;">
                    <button type="submit" class="btn btn-outline-light btn-sm w-100">🚪 Logout</button>
                </form>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:if="${success != null}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>⚙️ Turbocharger Management</h2>
                <a href="/backoffice/turbos/new" class="btn btn-primary">+ New Turbocharger</a>
            </div>

            <form th:action="@{/backoffice/turbos}" method="get" class="mb-3">
                <div class="input-group">
                    <input type="text" name="query" class="form-control" placeholder="Search by reference, brand, or model..."
                           th:value="${query}">
                    <button class="btn btn-outline-secondary" type="submit">Search</button>
                    <a th:href="@{/backoffice/turbos}" class="btn btn-outline-secondary">Clear</a>
                </div>
            </form>

            <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <th>Reference</th>
                    <th>Brand</th>
                    <th>Model</th>
                    <th>Geometry</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="turbo : ${turbos}">
                    <td><strong th:text="${turbo.ref}"></strong></td>
                    <td th:text="${turbo.brand}"></td>
                    <td th:text="${turbo.model}"></td>
                    <td th:text="${turbo.geo != null ? turbo.geo : '-'}"></td>
                    <td>
                        <a th:href="@{/backoffice/turbos/edit/{ref}(ref=${turbo.ref})}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <form th:action="@{/backoffice/turbos/delete/{ref}(ref=${turbo.ref})}" method="post" style="display:inline;"
                              onsubmit="return confirm('Are you sure you want to delete this turbocharger?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            </div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // Mobile sidebar toggle
    document.addEventListener('DOMContentLoaded', function() {
        var toggle = document.getElementById('sidebarToggle');
        var sidebar = document.getElementById('sidebar');
        var backdrop = document.getElementById('sidebarBackdrop');

        if (toggle && sidebar && backdrop) {
            toggle.addEventListener('click', function() {
                sidebar.classList.toggle('show');
                backdrop.classList.toggle('show');
            });
            backdrop.addEventListener('click', function() {
                sidebar.classList.remove('show');
                backdrop.classList.remove('show');
            });
        }
    });
</script>
</body>
</html>
