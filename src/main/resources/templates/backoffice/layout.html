<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - TurboMeta' : 'TurboMeta'}">TurboMeta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --tm-dark: #1e1e1e;
            --tm-dark-gray: #2d2d2d;
            --tm-gray: #3e3e3e;
            --tm-orange: #e67e22;
            --tm-yellow: #f1c40f;
            --tm-red: #e74c3c;
            --tm-light: #ecf0f1;
        }
        .sidebar { min-height: 100vh; background-color: var(--tm-dark-gray); }
        .sidebar a { color: var(--tm-light); text-decoration: none; padding: 10px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background-color: var(--tm-gray); color: var(--tm-orange); }
        .sidebar .brand { padding: 20px; font-size: 1.25rem; font-weight: 700; color: var(--tm-orange); border-bottom: 1px solid var(--tm-gray); }
        .main-content { padding: 2rem; }
        .btn-primary { background-color: var(--tm-orange); border-color: var(--tm-orange); }
        .btn-primary:hover { background-color: var(--tm-red); border-color: var(--tm-red); }
        .btn-outline-primary { color: var(--tm-orange); border-color: var(--tm-orange); }
        .btn-outline-primary:hover { background-color: var(--tm-orange); border-color: var(--tm-orange); color: #fff; }
        .badge.bg-primary { background-color: var(--tm-orange) !important; }
        .table, .table *, .table thead, .table tbody, .table th, .table td { background-color: #f5f5f5 !important; }
        .table thead tr, .table thead tr th { background-color: #e0e0e0 !important; }
        .table-striped tbody tr:nth-of-type(odd), .table-striped tbody tr:nth-of-type(odd) td { background-color: #e8e8e8 !important; }
        .table-hover tbody tr:hover, .table-hover tbody tr:hover td { background-color: #d0d0d0 !important; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
            <div class="brand">⚙️ TurboMeta</div>
            <div class="nav flex-column">
                <a th:href="@{/backoffice/users}" class="nav-link">👥 Users</a>
                <a th:href="@{/backoffice/turbos}" class="nav-link">⚙️ Turbochargers</a>
                <a th:href="@{/frontoffice/search}" class="nav-link">🔍 Search (Frontoffice)</a>
                <form th:action="@{/logout}" method="post" style="margin-top: 1rem;">
                    <button type="submit" class="btn btn-outline-light btn-sm w-100">🚪 Logout</button>
                </form>
            </div>
        </nav>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 main-content">
            <div th:if="${success != null}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${success}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${error != null}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div th:replace="${content}"></div>
        </main>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
